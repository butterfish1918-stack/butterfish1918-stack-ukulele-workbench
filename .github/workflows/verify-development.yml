name: Development verification
on:
  pull_request:
    branches: [main]
  push:
    branches: ['dev/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: npm run qa:library && npm run qa:arrangements && npm run qa:sources
      - run: bash scripts/browser-smoke.sh
