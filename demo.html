/* v0.2 notation-first Score Studio */
.nav-new{font-size:8px;color:#dfb780;margin-left:5px;letter-spacing:.08em;font-weight:800}
.work-input{width:100%;background:#15271e;color:#f3e9d5;border:1px solid #4c6453;border-radius:7px;padding:10px 12px;min-width:0;font:13px system-ui,sans-serif}
.score-editor-view{margin-top:16px;overflow-x:auto;border-radius:10px;max-width:100%;background:#eee8db;border:1px solid #798674;scrollbar-color:#ab946c #e6dfd0}
.score-editor-view .composed-score{display:block;width:100%;height:auto;min-height:180px}
.score-editor-view svg .score-event{cursor:pointer}
.score-editor-view svg .score-event:hover ellipse{stroke:#c48945;stroke-width:4}
.score-editor-view svg .score-event:focus{outline:none;filter:drop-shadow(0 0 3px #ab813f)}
.composed-score .score-event.playing ellipse{fill:#caa15c;stroke:#926a32;stroke-width:3}
.composed-score .score-event.playing rect{filter:drop-shadow(0 0 5px #bd9856)}
.score-entry{margin-top:14px;align-items:end}
.score-entry select{background:#15271e;border:1px solid #4c6453;border-radius:7px;padding:10px;color:#eee8d8;max-width:100%;min-width:0}
.score-entry .score-actions{gap:8px}
.score-fret-wrap{overflow:auto;margin-top:14px;border:1px solid #49614e;border-radius:9px;background:#21382c}
.score-fret-wrap svg{display:block;width:100%;min-width:470px}
.score-fret-wrap [data-score-position]{cursor:pointer}
.score-fret-wrap [data-score-position]:hover circle{stroke:#fff;stroke-width:3}
.score-help{display:flex;align-items:center;gap:7px;margin-top:15px}
.fingering-choice{margin-top:14px}
.song-score-preview{margin:18px 0 12px}
.song-score-preview svg{min-width:450px}
@media(max-width:720px){.mobile-nav button{padding:3px 4px;font-size:8px}.mobile-nav button span{font-size:21px}.score-editor-view{margin-top:12px}.score-editor-view svg{min-width:520px!important}.score-entry .span2{grid-column:1/-1}.score-entry .score-actions{flex-wrap:wrap}.score-fret-wrap svg{min-width:470px!important}.work-input{padding:9px}}

/* v0.5 Technique Academy: instrument-first practice with staff-notation previews. */
.tech-heading{font:29px Georgia,serif;margin:12px 0;color:#eee6d5}
.tech-status{display:block;color:#ddb779;margin-top:5px;font-size:10px}
.technique-score{margin:14px 0 10px}
.tech-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:7px;margin:16px 0}
.tech-step{border:1px solid #526957;background:#243d30;color:#e6e4d4;border-radius:8px;padding:11px 9px;text-align:left;min-width:0;cursor:pointer}
.tech-step b{display:block;color:#dfba7d;font-size:11px}
.tech-step span{display:block;font-size:12px;margin:6px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tech-step small{font-size:10px;color:#abbeb0}
.tech-step.selected,.tech-step:hover{border-color:#d7b779;background:#344c38}
.tech-playbar{padding:15px 0;border-top:1px solid #3d5040}
.tech-playbar .control{font-size:12px;display:block}
.tech-playbar input[type=range]{width:100%;accent-color:#d7b779;margin:10px 0 15px}
.tech-playbar .score-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.technique-score svg .score-tech-fingering{pointer-events:none}
@media(max-width:720px){.tech-heading{font-size:25px}.tech-step{padding:9px 7px}.tech-steps{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* v0.7 diatonic progression builder */
.progression-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin-top:14px}
.progression-option{background:#253b2f;border:1px solid #445a49;border-radius:8px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:11px}
.progression-option>b{color:#ead8af;font:17px Georgia,serif}
.progression-option .score-actions{gap:5px;flex-wrap:wrap}
.progression-list{display:grid;gap:9px;margin-top:14px;max-height:610px;overflow:auto}
.progression-step{border:1px solid #526b55;border-radius:10px;padding:12px;background:#24362d}
.progression-step.active{border-color:#ecc782;background:#36543c}
.progression-step-head{display:flex;gap:10px;align-items:center;margin-bottom:8px;min-width:0}
.progression-step-head>div{flex:1;min-width:0}
.progression-step-head b{display:block;color:#f3dda8;font:20px Georgia,serif}
.progression-step-head small{display:block;color:#a9c0ab;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progression-number{font:12px ui-monospace,monospace;color:#b5a07d}
.progression-frets{font:12px ui-monospace,monospace;color:#e8b977;white-space:nowrap}
.progression-step .score-actions{display:flex;gap:6px;flex-wrap:wrap}
.progression-preview{margin-top:18px}
@media(max-width:720px){.mobile-nav{overflow-x:auto;justify-content:flex-start;gap:3px}.mobile-nav button{flex:0 0 12%;padding:3px 0}.progression-options{grid-template-columns:repeat(2,minmax(0,1fr))}.progression-option{padding:10px}.progression-option .btn{font-size:10px;padding:7px}}

/* v0.9 notation-first rhythmic sight-reading */
.rhythm-lab .mini-pill{margin-top:2px;display:inline-flex;align-items:center;min-height:36px}
.rhythm-lab-controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:13px 0}
.rhythm-lab-controls .btn[disabled]{opacity:.5;cursor:not-allowed}
.rhythm-lab-status{margin-top:9px;min-height:39px}
.rhythm-lab .tap-flash{animation:tapPulse .22s ease-out}
@keyframes tapPulse{0%{box-shadow:0 0 0 0 #e4ba74aa}100%{box-shadow:0 0 0 9px transparent}}
@media(max-width:720px){.rhythm-lab .control-row{gap:9px}.rhythm-lab-controls .btn{flex:1 1 auto}.rhythm-lab .score-editor-view svg{min-width:600px!important}}

/* v1.0 preview: key signatures and graduated pitch sight-reading */
.key-reading-lab .score-editor-view,.pitch-reading-lab .score-editor-view{margin-bottom:13px}
.key-reading-lab .quiz-options,.pitch-reading-lab .quiz-options{margin:13px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.key-reading-lab .quiz-option,.pitch-reading-lab .quiz-option{min-width:0;white-space:normal;line-height:1.3}
.key-reading-lab .mini-pill,.pitch-reading-lab .mini-pill{display:flex;align-items:center;min-height:35px}
.key-reading-lab .score-actions,.pitch-reading-lab .score-actions{flex-wrap:wrap;gap:8px}
@media(max-width:720px){.key-reading-lab .quiz-options,.pitch-reading-lab .quiz-options{grid-template-columns:repeat(2,minmax(0,1fr))}.key-reading-lab .control-row,.pitch-reading-lab .control-row{gap:9px}}

/* Optional online VexFlow preview. Core notation remains independent and offline. */
.engraving-wrapper{margin:12px 0 20px;border:1px solid #b2a17e;border-radius:10px;background:#eee8db;padding:14px;max-width:100%}
.engraving-wrapper .sub-label{color:#455a47;margin-bottom:8px;display:block}
.engraving-wrapper .small-text{color:#52614e;margin:8px 0 0}
.engraving-scroll{background:#fffdf8;overflow:auto;max-width:100%;min-height:120px;border-radius:6px}
.engraving-scroll svg{display:block;max-width:none}
.engraving-scroll [data-event-id]{cursor:pointer}
.engraving-scroll [data-event-id]:focus{outline:2px solid #b47b32}
/* UKULELE WORKBENCH // UNDERGROUND GARAGE × INDUSTRIAL RACING
   v1.5.0 original interface skin. No external fonts/images required. */
:root{
  font-family:"Arial", "Helvetica Neue",sans-serif;
  color:#e6e8e5;background:#101315;
  --bg:#101315;--side:#17191c;--panel:#202326;--panel-light:#2a2e31;
  --panel-dark:#15181a;--line:#43484b;--gold:#b9f700;--gold-soft:#a1cc25;
  --mint:#c8f45f;--muted:#abb3b1;--cream:#f1f1ec;--red:#ef4738;
  --radius:4px;--asphalt:#101315;--lime:#b9f700;--orange:#ff7a24;
  --silver:#d8dce0;--display:Impact,"Arial Narrow","Franklin Gothic Medium",sans-serif;
}
html{background:#101315;color-scheme:dark}
body{background:radial-gradient(ellipse at 74% 0%,rgba(99,117,117,.15),transparent 49%),
  repeating-linear-gradient(135deg,transparent 0 46px,rgba(255,255,255,.009) 47px 48px),
  linear-gradient(#171a1d,#0e1011);color:#e6e8e5}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.065;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.38'/%3E%3C/svg%3E")}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible,summary:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.app-shell{grid-template-columns:224px minmax(0,1fr)}
.sidebar{background:
  linear-gradient(128deg,transparent 0 67%,rgba(255,255,255,.028) 67.2% 67.5%,transparent 67.7%),
  repeating-linear-gradient(0deg,transparent 0 29px,rgba(255,255,255,.013) 29px 30px),
  linear-gradient(155deg,#1d2224,#111416 68%,#202427);
  border-right:3px solid #545a59;padding:20px 12px 16px 17px;box-shadow:inset -7px 0 18px #05050580;overflow:auto}
.sidebar::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;
  background:repeating-linear-gradient(115deg,var(--lime) 0 13px,#1d2426 13px 20px)}
.brand{margin:7px 1px 26px;gap:9px;align-items:center;padding:7px 0 17px;border-bottom:1px solid #4b5254}
.brand-mark{width:60px;height:64px;border:0;border-left:4px solid var(--lime);border-bottom:4px solid var(--lime);border-radius:0;background:#121715;display:grid;place-items:center;transform:skew(-9deg);filter:drop-shadow(1px 0 5px #b9f70040)}
.brand-mark svg{transform:skew(9deg)}
.brand-name{font:italic 24px/.96 var(--display);letter-spacing:.5px;color:#f2f1ee;text-shadow:2px 2px #111}
.brand-small{font-size:9px;letter-spacing:1.5px;color:var(--lime);margin:0 0 4px;font-weight:900}
.nav-label,.eyebrow,.sub-label{color:var(--lime);font-weight:900;letter-spacing:1.3px}
.nav-label{font-size:10px;margin:0 4px 11px}
.nav-item{padding:11px 10px 11px 12px;border-radius:0;min-height:49px;margin:2px 0;gap:11px;color:#ccd0d1;font:italic 15px/1.1 var(--display);letter-spacing:.3px;text-transform:uppercase;border-bottom:1px solid #ffffff0d;transition:background .13s,transform .13s,color .13s}
.nav-item .nav-ico{font-family:Arial,sans-serif;font-size:22px;width:24px;color:#bcc4c2}
.nav-item:hover:not(.active){background:#303638;color:#fff;transform:translateX(2px)}
.nav-item.active{background:var(--lime);color:#101412;clip-path:polygon(0 0,94% 0,100% 50%,94% 100%,0 100%,3% 51%);box-shadow:inset 0 0 0 2px #bddf36}
.nav-item.active .nav-ico{color:#14191b}
.nav-new{display:none}
.sidebar-bottom{margin-top:auto;padding:18px 4px 1px;border-top:1px solid #555b5d;color:#bfc3c1}
.garage-id{font:italic 13px var(--display);letter-spacing:1px;color:#d2d6d3}
.garage-meter{display:flex;gap:4px;margin:13px 0}
.garage-meter i{height:10px;flex:1;transform:skew(-23deg);background:var(--lime)}
.garage-meter i:nth-child(n+6){background:#545e60}
.garage-status{font:700 10px Arial,sans-serif;color:var(--lime);letter-spacing:1px;line-height:1.7}
.garage-status span{display:block;color:#8b999a;font:9px/1.8 Arial,sans-serif}
.app-version{margin-top:15px;border-color:#41494a;font-size:9px;color:#8d9799;padding-top:11px}
.app-version b{color:var(--lime)}
.app-main{background:radial-gradient(circle at 67% 0%,rgba(108,124,127,.06),transparent 32%);min-width:0}
.topbar{height:57px;padding:0 25px;border-bottom:2px solid #44494d;background:
  repeating-linear-gradient(98deg,transparent 0 9px,rgba(255,255,255,.016) 9px 10px),linear-gradient(#292e31,#171a1d);box-shadow:0 4px 14px #0006}
.breadcrumb{color:#adb3b5;font:800 10px Arial,sans-serif;letter-spacing:1.2px}
.breadcrumb strong{font-size:11px;color:#f1f4f2;text-transform:uppercase}
.slash{color:var(--orange);font-weight:900}
.offline-pill{color:#c3e77a;font:800 10px Arial,sans-serif;letter-spacing:.5px}
.tool-button{background:#252b2d;border:1px solid #62696d;border-radius:2px;padding:8px 11px;font:italic 13px var(--display);letter-spacing:.7px;color:#e0e2df;text-transform:uppercase}
.tool-button:hover{background:#373d3e;border-color:var(--lime)}
.tool-button.gold,.btn.gold{color:#151a19;background:var(--lime);border-color:#c5f243}
.tool-button.gold:hover,.btn.gold:hover{background:#d7ff52}
main{padding:20px clamp(13px,2vw,32px) 55px;max-width:1920px}
.panel{position:relative;border:1px solid #555a5e;border-radius:3px;background:
  linear-gradient(145deg,rgba(255,255,255,.035),transparent 40%),#1e2325;
  box-shadow:0 4px 12px #0005,inset 0 1px #ffffff1c;overflow:hidden}
.panel::before{content:"";height:4px;width:68px;position:absolute;top:0;right:15px;z-index:1;transform:skew(-20deg);
  background:repeating-linear-gradient(90deg,var(--lime) 0 11px,#202528 11px 16px)}
.panel-pad{padding:19px}
.panel-title{margin-bottom:13px}
.panel-title h2,.section-bar h2{font:italic 22px/1.07 var(--display);letter-spacing:.6px;text-transform:uppercase;color:#f0f2ef}
.panel-desc,.hero p,.small-text{color:#bfc6c4;line-height:1.58}
.hero{border-left:5px solid var(--orange);padding:8px 0 8px 17px;margin-bottom:18px;background:linear-gradient(90deg,#ff7a2416,transparent 65%)}
.hero h1{font:italic clamp(31px,3.2vw,54px)/1 var(--display);letter-spacing:1px;margin:7px 0 8px;text-transform:uppercase}
.hero h1 em{color:var(--lime)}
.hero-badge{border-radius:2px;background:#2b3032;border-color:#6a7273;color:var(--lime);font-weight:900}
.btn{border-radius:2px;background:linear-gradient(#383c3e,#272c2e);border-color:#565f60;color:#eff0eb;font:italic 13px/1.1 var(--display);letter-spacing:.5px;text-transform:uppercase;padding:10px 14px;box-shadow:inset 0 1px #ffffff18}
.btn:hover{background:#485053;border-color:var(--lime)}
.btn.compact{font-size:12px;padding:8px 10px}
.btn.ghost{background:#161b1de0}
.btn.secondary{background:#2d3435}
.btn.active{background:#3e4939;border-color:var(--lime);color:var(--lime)}
.control label,.form-grid label{color:#b9c4c2;font:800 10px Arial,sans-serif;letter-spacing:.8px}
.control input,.control select,.control textarea,.form-field,.score-entry select,input[type=text],input[type=number],textarea{background:#14181a;color:#e8e9e5;border:1px solid #5b6566;border-radius:2px}
.control input:focus,.control select:focus{border-color:var(--lime)}
input[type=range]{accent-color:var(--lime)}
.tabbar{background:#101415;border:1px solid #5b6266;border-radius:2px;gap:0}
.tabbar button{font:italic 12px var(--display);letter-spacing:.25px;border-radius:1px;color:#bec6c3;text-transform:uppercase}
.tabbar button.active{background:var(--lime);color:#141818}
.sub-label{font-size:10px;color:var(--lime)}
.nav-ico,.tabbar button,.btn{user-select:none}
/* Workspace — the notation is intentionally the calm, readable part of the machine. */
.studio-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:8px 13px 13px;margin-bottom:14px;border-bottom:3px solid #606668;background:linear-gradient(100deg,#202629,#111518 75%);position:relative}
.studio-heading::before{content:"";position:absolute;bottom:0;left:0;width:88px;height:3px;background:var(--orange)}
.studio-heading-title{min-width:0}
.studio-eyebrow{font:900 10px Arial,sans-serif;letter-spacing:1.8px;color:var(--orange)}
.studio-heading h1{margin:3px 0 0;color:#f0f1ee;font:italic clamp(37px,4.8vw,76px)/.92 var(--display);letter-spacing:1.5px;text-shadow:3px 3px #0d0e0e;white-space:nowrap}
.studio-heading h1 em{font-style:inherit;color:#e5e7e7}
.studio-heading-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 0;margin:0 0 4px;justify-content:flex-end}
.studio-heading-meta>span{font:800 11px Arial,sans-serif;white-space:nowrap;padding:6px 10px;border-left:1px solid #535d5c;color:#f0f0ec}
.studio-heading-meta small{display:inline-block;color:var(--orange);font:900 10px Arial,sans-serif;margin-right:6px}
.studio-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,300px);grid-template-areas:"score inspector" "fret inspector";gap:12px;align-items:stretch}
.studio-layout .studio-score-sheet{grid-area:score;padding:16px;background:linear-gradient(120deg,#2b3033,#1b2022 24%,#1e2427 90%)}
.studio-layout .studio-inspector{grid-area:inspector;padding:16px;overflow:visible}
.studio-layout .studio-fret-panel{grid-area:fret;padding:14px 16px}
.studio-score-title{margin-bottom:10px;align-items:center}
.studio-score-title h2{font-size:21px}
.studio-score-tools{margin:0 0 12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:flex-start}
.studio-score-tools .tabbar{margin-right:auto}
.studio-score-tools+.score-actions{margin-bottom:11px}
.studio-paper-label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px 0;background:#f0f0eb;color:#1f2526;border:1px solid #949b9a;border-bottom:0}
.studio-paper-label>span{font:italic 19px Georgia,serif;color:#23292a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.studio-paper-label small{font:900 9px Arial,sans-serif;color:#657274;letter-spacing:.7px;text-align:right}
.studio-layout .score-editor-view{background:#f0f0eb!important;border:1px solid #949b9a;border-top:0;border-radius:0;margin:0;min-height:210px;padding:5px 12px 12px;scrollbar-color:#87928b #ecece5}
.studio-layout .composed-score{min-height:215px}
.studio-layout .composed-score rect[fill="#eee8db"],.studio-layout .composed-score rect[fill="#f0eadd"]{fill:#f0f0eb}
.studio-layout .score-editor-view .score-event.selected ellipse{fill:var(--orange)!important;stroke:#202729!important}
.studio-layout .score-info{font:800 10px Arial,sans-serif;letter-spacing:.3px;color:#9ca9a8}
.studio-layout .score-help{font:12px Arial,sans-serif;color:#c0c9c5}
.studio-settings{margin-top:14px;border-top:1px solid #565e60;padding-top:8px}
.studio-settings summary{cursor:pointer;color:var(--lime);font:italic 14px var(--display);letter-spacing:.7px;padding:9px 7px}
.studio-settings summary span{color:#adb8b4;font:10px Arial,sans-serif;letter-spacing:.2px;margin-left:9px}
.studio-settings .control-row{padding:12px 8px;gap:9px}
.studio-settings .control{flex:1 1 105px}
.studio-settings .control input,.studio-settings .control select{width:100%}
.studio-inspector .panel-title{display:block;padding-bottom:10px;border-bottom:2px solid #60686a}
.studio-inspector .panel-title h2{font-size:24px}
.studio-inspector .panel-title .sub-label{display:block;margin-top:8px;color:var(--lime)}
.studio-inspector .panel-desc{font-size:12px;color:#aeb9b7}
.studio-inspector .score-entry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 9px}
.studio-inspector .score-entry>div{min-width:0}
.studio-inspector .score-entry select{font-size:12px;width:100%;padding:9px 7px}
.studio-inspector .score-entry .span2{grid-column:1/-1}
.studio-inspector .score-actions .btn{flex:1 1 auto;min-width:0}
.studio-inspector .score-entry .score-actions .btn.gold{width:100%;flex-basis:100%}
.studio-inspector .small-text{font-size:11px;line-height:1.65;color:#aeb8b8}
.studio-sync{display:inline-block;padding:3px 6px;background:var(--lime);color:#141719;font:900 10px Arial,sans-serif;vertical-align:middle;transform:skew(-9deg);margin-left:7px}
.studio-fret-panel .panel-title{align-items:center}
.studio-fret-panel .panel-title h2{font-size:20px}
.studio-fret-panel .score-fret-wrap{background:linear-gradient(180deg,#1b1c1c,#332a22 48%,#171a1a);border:1px solid #6c6558;border-radius:0;max-height:245px;padding:5px 7px}
.studio-fret-panel .score-fret-wrap svg{min-width:475px;width:100%;max-height:195px}
.studio-fret-panel .score-fretboard>rect{fill:#2b211d}
.studio-fret-panel .score-fretboard [data-score-position] circle{fill:var(--lime);stroke:#101615}
.studio-fret-panel .score-fretboard [data-score-position] text{fill:#0f1514}
.studio-fret-panel .score-fretboard [data-score-position]:hover circle{stroke:#fff;stroke-width:3}
.studio-fret-panel .fingering-choice{margin-top:10px;max-height:84px;overflow:auto}
.studio-transport{margin-top:12px;padding:10px 14px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  border:1px solid #5c6263;background:linear-gradient(120deg,#272b2e,#15191b 45%,#24292b);box-shadow:inset 0 2px #ffffff15,0 3px 12px #0005;position:relative}
.studio-transport::before{content:"";position:absolute;top:0;left:12px;width:90px;height:4px;transform:skew(-18deg);background:repeating-linear-gradient(90deg,var(--orange) 0 13px,transparent 13px 19px)}
.studio-transport-label{width:90px;color:#d5d9da;font:italic 17px/1.05 var(--display);letter-spacing:.3px}
.studio-transport-label b{display:block;color:var(--lime);font-size:12px}
.studio-transport-controls{display:flex;align-items:center;flex-wrap:wrap;gap:7px;flex:1 1 360px}
.transport-play{border:2px solid #e3ff6a;color:#141716;background:var(--lime);font:italic 21px var(--display);padding:11px 19px;min-width:97px;transform:skew(-5deg)}
.transport-play:hover{background:#d3ff51}
.transport-utility{font:italic 14px var(--display);color:#ecf0ef;background:#262a2e;border:1px solid #656e70;padding:12px 10px;min-width:71px}
.transport-utility:hover{border-color:var(--lime);color:var(--lime)}
.transport-utility:disabled{opacity:.42;cursor:not-allowed}
.transport-save{color:var(--orange);border-color:#c87846}
.studio-bpm{display:flex;align-items:center;gap:9px;margin-left:auto;border-left:2px solid #545e5e;padding-left:10px}
.studio-bpm small{font:900 10px Arial,sans-serif;color:#bfc8c4;letter-spacing:1px}
.studio-bpm strong{font:italic 35px var(--display);color:var(--orange);text-shadow:0 0 12px #ff742438}
.studio-telemetry{display:flex;gap:18px;align-items:center;padding-left:15px;border-left:1px solid #626b6e}
.studio-telemetry-pitch{display:grid;grid-template-columns:auto auto;column-gap:8px;min-width:107px}
.studio-telemetry-pitch small{grid-column:1/-1;color:#9dacac;font:900 9px Arial,sans-serif;letter-spacing:.4px}
.studio-telemetry-pitch strong{font:italic 25px var(--display);color:var(--lime);line-height:1.2}
.studio-telemetry-pitch span{font:10px Arial,sans-serif;color:#eceeed;align-self:center}
.studio-telemetry-progress{min-width:116px}
.studio-telemetry-progress small{font:italic 13px var(--display);color:#dce3df}
.studio-progress-track{height:11px;background:repeating-linear-gradient(106deg,#555d60 0 12px,#1b1f21 12px 16px);margin-top:6px;overflow:hidden;transform:skew(-12deg)}
.studio-progress-track i{height:100%;display:block;background:repeating-linear-gradient(106deg,var(--orange) 0 12px,#b95119 12px 16px)}
.studio-secondary{margin-top:12px}
.studio-secondary .panel{background:#1b2022}
.studio-secondary .panel-title h2,.studio-secondary h2{font:italic 20px var(--display);text-transform:uppercase}
/* All activities inherit one graphic language, but retain their own tools. */
#pageContent[data-mode="practice"] .stat strong,#pageContent[data-mode="notation"] .stat strong{color:var(--lime)}
.stats .stat{border-radius:3px;background:#242a2c;border-color:#5b6567}
.lesson,.song-row,.progression-step,.progression-option{border-radius:2px;background:#262c2e;border-color:#566162}
.lesson-icon,.song-initial{color:var(--lime);background:#171b1e;border-color:#536063}
.lesson:hover,.progression-option:hover,.progression-step:hover{border-color:var(--lime)}
.progression-step.active,.tech-step.selected{border-color:var(--lime);background:#364333}
.progression-step-head b,.progression-option>b{color:#eef0eb;font-family:var(--display)}
.status-tag,.mini-pill{border-radius:2px;color:var(--lime)}
.fretboard-wrap:not(.score-fret-wrap){border-radius:2px;background:#181e20;border-color:#5a6264}
.score-holder{border-radius:2px;background:#f0f0eb;color:#1f2c2c}
.score-holder svg rect[fill="#eee8db"]{fill:#f0f0eb}
.engraving-wrapper{background:#eaeae3;border-color:#9caaa6;border-radius:2px}
.tool-dialog{border:2px solid var(--lime);border-radius:3px;background:#181e20;color:#e5e9e5}
.big-tuner{border-color:#515e5f;background:#111516}
.tuner-note{color:var(--lime)}

<script>
// music.js
/** Canonical, dependency-free ukulele theory model. All pitches are sounding MIDI values. */
const PITCH_CLASSES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ROOTS = ['C','C#','Db','D','Eb','E','F','F#','Gb','G','Ab','A','Bb','B'];
const LETTERS = ['C','D','E','F','G','A','B'];
const NATURAL = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const TUNINGS = {
  highG:{label:'High G · GCEA',names:['G','C','E','A'],midi:[67,60,64,69],description:'Re-entrant concert tuning'},
  lowG:{label:'Low G · GCEA',names:['G','C','E','A'],midi:[55,60,64,69],description:'Linear fourth string'},
  baritone:{label:'Baritone · DGBE',names:['D','G','B','E'],midi:[50,55,59,64],description:'Baritone ukulele tuning'}
};
const SCALES = {
  major:{name:'Major (Ionian)',steps:[0,2,4,5,7,9,11],degrees:[0,1,2,3,4,5,6]},
  naturalMinor:{name:'Natural minor',steps:[0,2,3,5,7,8,10],degrees:[0,1,2,3,4,5,6]},
  harmonicMinor:{name:'Harmonic minor',steps:[0,2,3,5,7,8,11],degrees:[0,1,2,3,4,5,6]},
  melodicMinor:{name:'Melodic minor (ascending)',steps:[0,2,3,5,7,9,11],degrees:[0,1,2,3,4,5,6]},
  dorian:{name:'Dorian',steps:[0,2,3,5,7,9,10],degrees:[0,1,2,3,4,5,6]},
  phrygian:{name:'Phrygian',steps:[0,1,3,5,7,8,10],degrees:[0,1,2,3,4,5,6]},
  lydian:{name:'Lydian',steps:[0,2,4,6,7,9,11],degrees:[0,1,2,3,4,5,6]},
  mixolydian:{name:'Mixolydian',steps:[0,2,4,5,7,9,10],degrees:[0,1,2,3,4,5,6]},
  locrian:{name:'Locrian',steps:[0,1,3,5,6,8,10],degrees:[0,1,2,3,4,5,6]},
  majorPenta:{name:'Major pentatonic',steps:[0,2,4,7,9],degrees:[0,1,2,4,5]},
  minorPenta:{name:'Minor pentatonic',steps:[0,3,5,7,10],degrees:[0,2,3,4,6]},
  blues:{name:'Minor blues',steps:[0,3,5,6,7,10],degrees:[0,2,3,4,4,6]}
};
const mod = (n,m) => ((n%m)+m)%m;
function notePc(name){const m=/^([A-G])([#b]{0,2})$/.exec(name);if(!m)throw new Error('Invalid note: '+name);return mod(NATURAL[m[1]] + [...m[2]].reduce((a,c)=>a+(c==='#'?1:-1),0),12);}
function spelledScale(root,scaleKey='major'){
  const s=SCALES[scaleKey];if(!s)throw new Error('Unknown scale');
  const tonic=notePc(root), tonicLetter=LETTERS.indexOf(root[0]);
  return s.steps.map((step,i)=>{
    const pc=mod(tonic+step,12);
    if(s.degrees===null){return {pc,name:nearestSpelling(pc,root),degree:i+1,step};}
    const letter=LETTERS[mod(tonicLetter+s.degrees[i],7)];
    const diff=mod(pc-NATURAL[letter]+6,12)-6;
    const suffix=diff>0?'#'.repeat(diff):'b'.repeat(-diff);
    return {pc,name:letter+suffix,degree:i+1,step};
  });
}
function nearestSpelling(pc,root){
 const preferred=/b/.test(root)?['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B']:PITCH_CLASSES;
 return preferred[pc];
}
function midiName(midi,preferFlats=false){
 const flat=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
 return (preferFlats?flat:PITCH_CLASSES)[mod(midi,12)] + (Math.floor(midi/12)-1);
}
const midiFreq=(midi,concertA=440)=>concertA*Math.pow(2,(midi-69)/12);
function freqMidi(hz,concertA=440){return 69+12*Math.log2(hz/concertA);}
function fretboard(tuningKey='highG',frets=12){
 const t=TUNINGS[tuningKey];if(!t)throw new Error('Unknown tuning');
 return t.midi.map((open,string)=>Array.from({length:frets+1},(_,fret)=>({string,fret,midi:open+fret,pc:mod(open+fret,12)})));
}
function optionsForMidi(midi,tuningKey='highG',frets=12){return fretboard(tuningKey,frets).flat().filter(p=>p.midi===midi);}
function scalePositions(root,scale='major',tuning='highG',frets=12){const pcs=new Set(spelledScale(root,scale).map(x=>x.pc));return fretboard(tuning,frets).flat().filter(p=>pcs.has(p.pc));}
function chordFromScale(root='C',scale='major',degree=0,extension=3){
 const notes=spelledScale(root,scale);if(notes.length!==7) return null;
 const s=SCALES[scale];
 const stack=Array.from({length:extension},(_,i)=>{const pos=degree+2*i;const idx=pos%7;return {...notes[idx],absolute:s.steps[idx]+12*Math.floor(pos/7)};});
 const d1=mod(stack[1].absolute-stack[0].absolute,12);
 const d2=mod(stack[2].absolute-stack[0].absolute,12);
 const quality=d1===4&&d2===7?'major':d1===3&&d2===7?'minor':d1===3&&d2===6?'diminished':d1===4&&d2===8?'augmented':'other';
 const name=stack[0].name+({major:'',minor:'m',diminished:'dim',augmented:'aug',other:''}[quality]);
 const seventh=extension===4?stack[3].absolute-stack[0].absolute:null;
 const suffix=extension===4 ? (quality==='major'&&seventh===11?'maj7':quality==='major'&&seventh===10?'7':quality==='minor'&&seventh===10?'m7':quality==='minor'&&seventh===11?'m(maj7)':quality==='diminished'&&seventh===10?'m7b5':quality==='diminished'&&seventh===9?'dim7':'7') : null;
 return {name:extension===4?stack[0].name+suffix:name,quality,pcs:stack.map(n=>n.pc),notes:stack.map(n=>n.name),degree:degree+1};
}
function harmonizedChords(root='C',scale='major',extension=3){if(spelledScale(root,scale).length!==7)return [];return Array.from({length:7},(_,i)=>chordFromScale(root,scale,i,extension));}
/** Search easy four-string voicings by fewest fingered notes and narrowest span. */
function chordVoicings(pcs,tuningKey='highG',frets=12,limit=5){
 const target=new Set(pcs), strings=fretboard(tuningKey,frets).map(row=>row.filter(x=>target.has(x.pc) && x.fret<=9));
 let candidates=[];
 function traverse(s,chosen){
  if(s===4){
   const notes=chosen.filter(Boolean);
   if(notes.length<3)return;
   const used=new Set(notes.map(x=>x.pc));
   if([...target].some(pc=>!used.has(pc)))return;
   const fretted=notes.filter(x=>x.fret>0).map(x=>x.fret), span=fretted.length?Math.max(...fretted)-Math.min(...fretted):0;
   if(span>4)return;
   const max=Math.max(...fretted,0);
   const score=span*3+max*.35+fretted.length*.5+(4-notes.length)*1.1;
   candidates.push({frets:chosen.map(x=>x?x.fret:-1),midis:chosen.map(x=>x?x.midi:null),score});return;
  }
  traverse(s+1,[...chosen,null]);
  for(const fret of strings[s]) traverse(s+1,[...chosen,fret]);
 }
 traverse(0,[]);
 candidates.sort((a,b)=>a.score-b.score);
 const uniq=new Set();return candidates.filter(c=>{const sig=c.frets.join('-');if(uniq.has(sig))return false;uniq.add(sig);return true;}).slice(0,limit);
}
function scaleMelody(root='C',scale='major',tuningKey='highG'){
 const notes=spelledScale(root,scale),tonicPc=notePc(root),baseTuning=TUNINGS[tuningKey];
 const playable=[];
 for(let midi=48;midi<=74;midi++){
   if(mod(midi,12)!==tonicPc||!optionsForMidi(midi,tuningKey,12).length)continue;
   const score=notes.reduce((count,n)=>count+(optionsForMidi(midi+n.step,tuningKey,12).length?1:0),0);
   playable.push({midi,score});
 }
 playable.sort((a,b)=>b.score-a.score||a.midi-b.midi);
 const tonic=playable[0]?.midi??baseTuning.midi[1];
 return notes.map(n=>({midi:tonic+n.step,spelling:n.name,degree:n.degree,pc:n.pc}));
}

function accidentalMarks(events,keySignature='C',suppressFirstTied=false) {

  if(suppress)return '';

  const suffix=spelling.slice(1),previous=active.has(key)?active.get(key):keyAccidental(keySignature,spelling[0]);

  if(ev.type==='chord')return ev.notes.map(note=>mark(note,false));

}
function accidentalGlyph(symbol){

}
function noteGlyph(x,y,ev,selected,{beamed=false,accidental=''}={}){

 let out=ledgerLines(x,y,54,102);
 if(accidental)out+=`<text x="${x-26}" y="${y+6}" fill="#30463a" font-size="23" font-family="serif">${esc(accidentalGlyph(accidental))}</text>`;
 out+=`<ellipse cx="${x}" cy="${y}" rx="9" ry="6" transform="rotate(-18 ${x} ${y})" fill="${filled?color:'#eee8db'}" stroke="${color}" stroke-width="2.1"/>`;
 if(basic<4 && !beamed){
  const stemUp=y>=78,stemX=stemUp?x+8:x-8,tip=stemUp?y-38:y+38;
  out+=`<path d="M${stemX} ${y} V${tip}" stroke="${color}" stroke-width="2" fill="none"/>`;
  if(basic<=.5){const sign=stemUp?1:-1;
   out+=`<path d="M${stemX} ${tip}q${sign*23} ${sign*7} ${sign*8} ${sign*29}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"/>`;
   if(basic===.25)out+=`<path d="M${stemX} ${tip+sign*11}q${sign*22} ${sign*7} ${sign*7} ${sign*27}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round"/>`;

function chordGlyph(x,ev,marks,selected){

 // Chord stacks are one rhythmic event. Their noteheads share a stem, not separate stems.
 for(const n of notes){
  out+=ledgerLines(x,n.y,54,102);
  if(n.mark)out+=`<text x="${x-28}" y="${n.y+6}" fill="#30463a" font-size="21" font-family="serif">${esc(accidentalGlyph(n.mark))}</text>`;
  out+=`<ellipse cx="${x}" cy="${n.y}" rx="9" ry="6" transform="rotate(-18 ${x} ${n.y})" fill="${filled?color:'#eee8db'}" stroke="${color}" stroke-width="2"/>`;
  if(isDotted(ev.duration))out+=`<circle cx="${x+17}" cy="${n.y+2}" r="3" fill="${color}"/>`;

function renderBeams(groups,events,xs,selectedId,playingId){

  const ys=group.map(i=>staffYForSpelling(events[i].midi,events[i].spelling,102));
  const up=ys.reduce((a,b)=>a+b,0)/ys.length>=78;
  const beamY=up?Math.min(...ys)-38:Math.max(...ys)+38;
  const sx=i=>xs[i]+(up?8:-8);
  const color=group.some(i=>events[i].id===selectedId||events[i].id===playingId)?'#b47b32':'#23372b';
  const mainX1=sx(group[0]),mainX2=sx(group.at(-1));
  out+=`<g class="score-beam" aria-hidden="true" stroke="${color}" fill="none"><path d="M${mainX1} ${beamY} L${mainX2} ${beamY}" stroke-width="6"/>`;

  const secondaryY=beamY+(up?10:-10);
  let run=[];
  const flush=()=>{
   if(!run.length)return;
   if(run.length>=2)out+=`<path d="M${sx(run[0])} ${secondaryY} L${sx(run.at(-1))} ${secondaryY}" stroke-width="5"/>`;

  };

  out+='</g>';
 }

}

// history.js
/** Bounded in-memory edit history for a single score document.
 * Snapshots intentionally do not enter JSON backups; saving a new score clears the stack.
 */

function createHistory(score, limit=60) {
  validateScore(score);
  if (!Number.isInteger(limit) || limit<1 || limit>200) throw new Error('Invalid history limit');
  return {past:[],current:structuredClone(score),future:[],limit};
}
function canUndo(history) {return history.past.length>0;}
function canRedo(history) {return history.future.length>0;}
function commitHistory(history, score) {
  validateScore(score);
  if (JSON.stringify(score)===JSON.stringify(history.current)) return history;
  return {
    ...history,
    past:[...history.past, structuredClone(history.current)].slice(-history.limit),
    current:structuredClone(score), future:[]
  };
}
function undoHistory(history) {
  if (!canUndo(history)) return history;
  return {
    ...history,
    past:history.past.slice(0,-1),
    current:structuredClone(history.past.at(-1)),
    future:[structuredClone(history.current),...history.future].slice(0,history.limit)
  };
}
function redoHistory(history) {
  if (!canRedo(history)) return history;
  return {
    ...history,
    past:[...history.past,structuredClone(history.current)].slice(-history.limit),
    current:structuredClone(history.future[0]),
    future:history.future.slice(1)
  };
}

function techniqueScore(id,tuning='highG'){

/** CPU-only YIN-style fundamental estimator for monophonic ukulele notes.
 * No microphone, network or browser APIs are used by this module.
 * Output is advisory: harmonics and noisy rooms still require instrument checks.
 */
function estimateFundamental(samples,sampleRate,{minHz=70,maxHz=1100,threshold=0.15}={}){
 const n=samples?.length??0;
 if(n<1024||!Number.isFinite(sampleRate)||sampleRate<8000||minHz<=0||maxHz<=minHz) return null;
 let mean=0;for(let i=0;i<n;i++)mean+=samples[i];mean/=n;
 let energy=0;for(let i=0;i<n;i++){const s=samples[i]-mean;energy+=s*s}
 const rms=Math.sqrt(energy/n);if(!Number.isFinite(rms)||rms<0.012)return null;
 const minLag=Math.max(2,Math.floor(sampleRate/maxHz));
 const maxLag=Math.min(Math.floor(sampleRate/minHz),Math.floor(n/2)-1);
 if(maxLag<=minLag)return null;
 const window=n-maxLag;const diff=new Float64Array(maxLag+1);
 for(let lag=1;lag<=maxLag;lag++){
  let sum=0;for(let i=0;i<window;i+=2){const v=samples[i]-samples[i+lag];sum+=v*v}
  diff[lag]=sum;
 }
 let running=0;const cmnd=new Float64Array(maxLag+1);cmnd[0]=1;
 for(let lag=1;lag<=maxLag;lag++){running+=diff[lag];cmnd[lag]=running>0?diff[lag]*lag/running:1}
 let lag=-1;
 for(let i=minLag;i<maxLag;i++){
  if(cmnd[i]<threshold){while(i+1<=maxLag&&cmnd[i+1]<cmnd[i])i++;lag=i;break}
 }
 if(lag<0){let best=1;for(let i=minLag;i<=maxLag;i++)if(cmnd[i]<best){best=cmnd[i];lag=i}if(lag<0||best>0.25)return null}
 const a=cmnd[lag-1]??cmnd[lag],b=cmnd[lag],c=cmnd[lag+1]??cmnd[lag];
 const den=a-2*b+c;
 const delta=Math.abs(den)>1e-10?Math.max(-0.5,Math.min(0.5,(a-c)/(2*den))):0;
 const hz=sampleRate/(lag+delta),confidence=Math.max(0,Math.min(1,1-b));
 return hz>=minHz&&hz<=maxHz&&confidence>=0.75?{hz,confidence,rms}:null;
}

// storage-safety.js
/** Validate an entire backup before touching persistent data; commit with rollback.
 * This supplements, but cannot replace, regularly exported JSON backups.
 */
const isRecord=value=>value!==null&&typeof value==='object'&&!Array.isArray(value);
const OWN='ukulele-workbench-backup';

/** Returns validated, prefix-free JSON data that may be written as one transaction. */
function prepareBackupRestore(data,{validateScore,validateProgression,validTechniqueProgress,validRhythmProgress,validReadingProgress}){
 if(!isRecord(data)||data.format!==OWN||![1,2].includes(data.schemaVersion)||!Array.isArray(data.songs)||!Array.isArray(data.progress))throw new Error('Not a compatible backup');
 if(data.songs.length>1000||data.progress.length>10000)throw new Error('Backup has too many records');
 for(const song of data.songs){
  if(!isRecord(song)||typeof song.id!=='string'||typeof song.title!=='string'||song.title.length>120)throw new Error('Invalid song record');
  if(song.score!==undefined&&song.score!==null)validateScore(song.score);
 }
 for(const item of data.progress)if(!isRecord(item)||!Number.isFinite(item.minutes)||item.minutes<0||item.minutes>1440||typeof item.date!=='string')throw new Error('Invalid practice record');
 if(data.techniqueProgress!==undefined&&!validTechniqueProgress(data.techniqueProgress))throw new Error('Invalid technique progress');
 if(data.rhythmLabProgress!==undefined&&!validRhythmProgress(data.rhythmLabProgress))throw new Error('Invalid rhythm study progress');
 if(data.notationReadingProgress!==undefined&&!validReadingProgress(data.notationReadingProgress))throw new Error('Invalid notation reading progress');
 if(data.scoreDraft!==undefined&&data.scoreDraft!==null)validateScore(data.scoreDraft);
 if(data.progressionDraft!==undefined&&data.progressionDraft!==null)validateProgression(data.progressionDraft);
 if(data.rhythm!==undefined&&(!Array.isArray(data.rhythm)||data.rhythm.length!==8||data.rhythm.some(x=>!['','D','U'].includes(x))))throw new Error('Invalid strumming pattern');
 const values={songs:data.songs,progress:data.progress,techniqueProgress:data.techniqueProgress??{},rhythmLabProgress:data.rhythmLabProgress??{},notationReadingProgress:data.notationReadingProgress??{}};
 if(data.scoreDraft){values.scoreDraft=data.scoreDraft;values.scoreSongId=null;}
 if(data.progressionDraft)values.progressionDraft=data.progressionDraft;
 if(data.rhythm)values.rhythm=data.rhythm;
 if(data.tuning!==undefined){if(!['highG','lowG','baritone'].includes(data.tuning))throw new Error('Invalid tuning');values.tuning=data.tuning;}
 if(data.display!==undefined){if(!['notation','dual','tab'].includes(data.display))throw new Error('Invalid notation display');values.display=data.display;}
 return values;
}

/** Commit all validated keys, attempt to reinstate every old value if any write fails. */
function commitBackupRestore(storage,values,{prefix='uw-'}={}){
 if(!isRecord(values))throw new Error('Invalid restoration plan');
 const writes=Object.entries(values).map(([key,value])=>{
  if(!/^[A-Za-z][A-Za-z0-9]*$/.test(key))throw new Error('Unsafe storage key');
  const encoded=JSON.stringify(value);
  if(typeof encoded!=='string')throw new Error('Cannot encode backup field');
  return [prefix+key,encoded];
 });
 const old=new Map();
 // Snapshot all affected fields BEFORE performing the first mutation.
 for(const [key] of writes)old.set(key,storage.getItem(key));
 try{
  for(const [key,encoded] of writes){
   storage.setItem(key,encoded);
   if(storage.getItem(key)!==encoded)throw new Error('A local storage write was not retained');
  }
 }catch(cause){
  let rollbackOK=true;
  // Remove all newly-written fields before restoring old values: avoids quota traps.
  for(const [key] of writes)try{storage.removeItem(key)}catch{rollbackOK=false}
  for(const [key,value] of old)try{
   if(value!==null)storage.setItem(key,value);
   if(storage.getItem(key)!==value)rollbackOK=false;
  }catch{rollbackOK=false}
  throw new Error(rollbackOK?'Restore cancelled; previous local data recovered':'Restore failed; previous local data could not be fully recovered. Use your exported backup.',{cause});
 }
 return writes.length;
}

 const report=[];

 add('secure','Secure context',secureContext===true?'pass':'action',secureContext===true?'Secure-context APIs are permitted.':'Use HTTPS or localhost to permit microphone and service workers.');
 let saved=false;
 const key='uw-qa-probe-'+Math.random().toString(36).slice(2);
 try{
  storage.setItem(key,'probe');
  saved=storage.getItem(key)==='probe';
 }catch{}finally{try{storage.removeItem(key)}catch{}}
 add('storage','Local storage write/read',saved?'pass':'action',saved?'A temporary value was written and read successfully. This does NOT prove survival after browser-data clearing.':'Local storage is unavailable or rejected this test write. Export your work before continuing.');
 const sw=environment?.serviceWorker;
 if(!sw||!originIsServed){add('worker','Offline service worker','action','Not available from this preview or browser. Install from HTTPS/localhost and run again.');}
 else{
  try{const registration=await sw.getRegistration();add('worker','Offline service worker',registration?.active?'pass':'action',registration?.active?'An active service worker was found. Offline reload still needs a separate test.':'No active service worker was found for this page.');}
  catch{add('worker','Offline service worker','action','Service-worker registration could not be inspected.');}
 }
 // Cache readback is a diagnostic, not a real disconnect-and-reload test.
 if(!originIsServed || !cacheStorage?.match || !browserLocation?.href){
  add('offline-shell','Offline shell cached','action','Install from HTTPS/localhost and check again; an HTML file cannot verify cached PWA resources.');
 }else{
  try{
   const needed=['./index.html','./styles.css','./src/app.js','./manifest.webmanifest','./assets/icon-192.png'];
   const urls=needed.map(p=>new URL(p,browserLocation.href).href);

   const count=hits.filter(Boolean).length;
   add('offline-shell','Offline shell cached',count===needed.length?'pass':'action',
    `${count}/${needed.length} essential assets currently cached. A real offline reload is still required to verify operation.`);
  }catch{
   add('offline-shell','Offline shell cached','action','Cache inspection was blocked; verify offline reload manually in your browser.');
  }
 }

 try{
  const persisted=await environment?.storage?.persisted?.();
  add('persistence','Persistent storage grant',persisted===true?'pass':'info',persisted===true?'The browser reports storage persistence granted.':'Not granted or unavailable. Export JSON backups regularly.');

// song-library.js
/** Read-only remote song repository, separate from the owner's local Songbook.
 * No authentication, upload, or execution of remote content is required.
 * The caller validates score documents with the canonical score model.
 */
const CATALOG_FORMAT = 'ukulele-workbench-catalog';
const ARRANGEMENT_FORMAT = 'ukulele-workbench-arrangement';
const MAX_ENTRIES = 50;
const MAX_FILE_CHARS = 150_000;
const MAX_TOTAL_CHARS = 2_500_000;
const DEFAULT_CATALOG_URL = './library/catalog.json';
const slug = v => typeof v === 'string' && /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(v) && v.length <= 80;
const text = (v, max=160) => typeof v === 'string' && v.trim().length > 0 && v.length <= max;
const validTags = tags => Array.isArray(tags) && tags.length <= 12 && tags.every(t => text(t, 36));
const validBpm = v => Number.isInteger(v) && v >= 30 && v <= 240;
const hasOwn = (obj, key) => Object.prototype.hasOwnProperty.call(obj,key);

function catalogUrl(input,base='http://localhost/') {
 const url=new URL(String(input || DEFAULT_CATALOG_URL).trim(),base);
 const page=new URL(base);
 if(!['http:','https:'].includes(url.protocol) || url.username || url.password || url.hash || url.search)
  throw Error('Repository must use a plain HTTP(S) catalog URL without credentials, query or fragment');
 if(url.protocol==='http:' && !(url.hostname==='localhost'||url.hostname==='127.0.0.1'||url.hostname==='[::1]'))
  throw Error('External repositories require HTTPS');
 if(page.protocol==='https:' && url.protocol!=='https:')throw Error('Mixed-content repository URL is not allowed');
 if(!url.pathname.endsWith('/catalog.json'))throw Error('Choose a catalog.json URL inside a library folder');
 return url.href;
}

function validateCatalog(value) {
 if(!value || typeof value!=='object' || Array.isArray(value) || value.format!==CATALOG_FORMAT || value.schemaVersion!==1)
  throw Error('Unsupported song repository catalog');
 if(!text(value.name,120) || !Array.isArray(value.entries) || value.entries.length>MAX_ENTRIES)
  throw Error('Invalid repository name or number of arrangements');
 const ids=new Set(), files=new Set();
 for(const item of value.entries){
  if(!item||!slug(item.id)||!Number.isInteger(item.revision)||item.revision<1||!text(item.title,120)||!text(item.artist,120)
    ||!/^songs\/[a-z0-9-]+\.json$/.test(item.file)|| !['beginner','intermediate','advanced'].includes(item.difficulty)
    ||!validTags(item.tags)||ids.has(item.id)||files.has(item.file))throw Error('Invalid or repeated repository entry');
  ids.add(item.id);files.add(item.file);
 }
 return true;
}

function validateArrangement(value,metadata,validateScore){
 if(!value||typeof value!=='object'||Array.isArray(value)||value.format!==ARRANGEMENT_FORMAT||value.schemaVersion!==1)
  throw Error('Unsupported song arrangement');
 if(!slug(value.id)||value.id!==metadata.id||value.revision!==metadata.revision||value.title!==metadata.title||value.artist!==metadata.artist)
  throw Error('Arrangement does not match its repository entry');
 if(!text(value.title,120)||!text(value.artist,120)||!['beginner','intermediate','advanced'].includes(value.difficulty)||value.difficulty!==metadata.difficulty)
  throw Error('Invalid arrangement information');
 if(!validTags(value.tags)||!value.tags.every(t=>metadata.tags.includes(t)))throw Error('Invalid arrangement tags');
 if(!validBpm(value.bpm)||!text(value.key,20)||!text(value.description,1000)||typeof value.body!=='string'||value.body.length>10000
  ||typeof value.notes!=='string'||value.notes.length>10000||!value.score)throw Error('Invalid song content');
 validateScore(value.score);
 if(value.score.tuning!==value.tuning||value.score.key!==value.key||value.score.tempo!==value.bpm)
  throw Error('Score tuning, key or tempo does not match arrangement metadata');
 return true;
}

function validateSnapshot(value,validateScore){
 if(!value||typeof value!=='object'||!value.catalog||!value.songs||!text(value.catalogUrl,2048)||!text(value.syncedAt,64))
  throw Error('Invalid cached repository');
 validateCatalog(value.catalog);
 const ids=Object.keys(value.songs);
 if(ids.length!==value.catalog.entries.length)throw Error('Incomplete cached repository');
 for(const item of value.catalog.entries){
  if(!hasOwn(value.songs,item.id))throw Error('Missing cached arrangement');
  validateArrangement(value.songs[item.id],item,validateScore);
 }
 return true;
}

const fetchJson = async (url,fetcher,timeoutMs=12000) => {
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeoutMs);
 try {
  const response=await fetcher(url,{signal:controller.signal,credentials:'omit',redirect:'follow',cache:'no-store'});
  if(!response?.ok)throw Error(`Repository request failed (${response?.status??'network'})`);
  const length=Number(response.headers?.get?.('content-length')||0);
  if(length>MAX_FILE_CHARS)throw Error('Repository file exceeds the size limit');
  const raw=await response.text();
  if(raw.length>MAX_FILE_CHARS)throw Error('Repository file exceeds the size limit');
  return JSON.parse(raw);
 } finally {clearTimeout(timer)}
};

/** Fetch and validate the ENTIRE new catalog before returning. No local state changes. */
async function downloadRepository({source=DEFAULT_CATALOG_URL,base,fetcher=fetch,validateScore}){
 const url=catalogUrl(source,base);
 const catalog=await fetchJson(url,fetcher);
 validateCatalog(catalog);
 const songs={};let size=0;
 const root=new URL('.',url);
 for(const metadata of catalog.entries){
  const target=new URL(metadata.file,root);
  if(target.origin!==root.origin || !target.pathname.startsWith(root.pathname))throw Error('Invalid arrangement path');
  const arrangement=await fetchJson(target.href,fetcher);
  size+=JSON.stringify(arrangement).length;
  if(size>MAX_TOTAL_CHARS)throw Error('Repository exceeds local cache budget');
  validateArrangement(arrangement,metadata,validateScore);
  songs[metadata.id]=arrangement;
 }
 const snapshot={catalogUrl:url,syncedAt:new Date().toISOString(),catalog,songs};
 validateSnapshot(snapshot,validateScore);
 return snapshot;
}

/** Creates a NEW independent local song. An upstream update cannot mutate it. */
function copyToSongbook(snapshot,arrangementId,existingSongs,{id,now=new Date().toISOString(),validateScore}={}) {
 validateSnapshot(snapshot,validateScore);
 if(!Array.isArray(existingSongs))throw Error('Invalid local Songbook');
 const source=snapshot.songs[arrangementId];
 if(!source)throw Error('Arrangement not found');
 if(!text(id,120)||existingSongs.some(x=>x.id===id))throw Error('Choose a unique local song ID');
 return [...existingSongs,{
  id,title:source.title,artist:source.artist,key:source.key,bpm:source.bpm,
  body:source.body,notes:source.notes,score:structuredClone(source.score),updated:now,
  repositoryOrigin:{id:source.id,revision:source.revision,catalogUrl:snapshot.catalogUrl}
 }];
}

function playProgression(){

 const btn=$('[data-action="prog-play"]');if(btn)btn.textContent='■ Stop playback';

  playing.voices.push(...synthEvent(ev,start+ev.onset*seconds,seconds));
  playing.timers.push(setTimeout(()=>{
   if(progressionPlayback!==playing)return;
   playing.index=index;
   $$('.progression-step').forEach(x=>x.classList.toggle('active',Number(x.dataset.progressIndex)===index));
  },Math.max(0,(start+ev.onset*seconds-ctx.currentTime)*1000)));
 }
 const finish=events.at(-1).onset+events.at(-1).duration;
 playing.timers.push(setTimeout(()=>{if(progressionPlayback!==playing)return;stopProgression();toast('Progression complete')},Math.max(0,(start+finish*seconds-ctx.currentTime)*1000)+80));
}

 rhythmLabPlayback=run;state.rhythmLabResult=null;render();

function stopTechniquePlayback({redraw=false}={}){
 if(!techniquePlayback)return;
 const playback=techniquePlayback;techniquePlayback=null;
 playback.timers.forEach(clearTimeout);
 playback.voices.forEach(o=>{try{o.stop()}catch{}});
 state.techPlayingEventId=null;
 $$('.technique-score .score-event').forEach(e=>e.classList.remove('playing'));
 if(redraw&&state.page==='technique')render();
}
function playTechnique(){
 if(techniquePlayback){stopTechniquePlayback({redraw:true});return;}
 const unit=currentTechnique();if(!unit.pattern)return;
 const {score}=techniqueScore(unit.id,state.tuning),seconds=60/(state.techTempo||unit.tempo);
 const ctx=audio(),start=ctx.currentTime+.08+seconds*4;
 const playing={timers:[],voices:[]};techniquePlayback=playing;
 for(let beat=0;beat<4;beat++)tick(ctx.currentTime+.08+beat*seconds,beat===0);
 const status=$('#techPlaybackStatus');if(status)status.textContent='Count in: 4 beats, then play the score.';
 const events=timeline(score);
 for(const ev of events){
  if(ev.type!=='rest')playing.voices.push(...synthEvent(ev,start+ev.onset*seconds,seconds));
  playing.timers.push(setTimeout(()=>{
   if(techniquePlayback!==playing)return;
   state.techPlayingEventId=ev.id;
   $$('.technique-score .score-event').forEach(n=>n.classList.toggle('playing',n.dataset.eventId===ev.id));
   const current=$('#techPlaybackStatus');if(current)current.textContent=ev.type==='rest'?'Rest: keep the written silence.':ev.type==='chord'?`Now playing ${ev.symbol} chord (${ev.stroke}stroke).`:`Now playing ${ev.spelling} (${midiName(ev.midi)}).`;
  },Math.max(0,(start+ev.onset*seconds-ctx.currentTime)*1000)));
 }
 const finish=events.at(-1)?.onset+events.at(-1)?.duration||0;
 playing.timers.push(setTimeout(()=>{if(techniquePlayback!==playing)return;stopTechniquePlayback({redraw:true});toast('Étude complete — practise it yourself, then rate your confidence');},Math.max(0,(start+finish*seconds-ctx.currentTime)*1000)+100));
 render();
}

async function syncLibrary(){
 if(state.repoSyncing)return;
 const source=$('#repositoryUrl')?.value.trim()||DEFAULT_CATALOG_URL;
 try{
  const url=catalogUrl(source,location.href);
  state.repositorySource=source;store('repositorySource',source);
  state.repoSyncing=true;state.repoError=null;render();
  const snapshot=await downloadRepository({source:url,base:location.href,validateScore});
  if(!store('repositorySnapshot',snapshot))throw Error('Could not cache arrangements; the previous repository remains available');
  state.repositorySnapshot=snapshot;
  if(!snapshot.songs[state.repoSelectedId])state.repoSelectedId=snapshot.catalog.entries[0]?.id??null;
  toast(`Synced ${snapshot.catalog.entries.length} arrangement(s); your songs are unchanged`);
 }catch(err){state.repoError=`Sync failed: ${err.message}. The last validated library is unchanged.`;toast('Repository sync failed; cached songs are intact')}
 finally{state.repoSyncing=false;if(state.page==='songbook')render()}
}

function stopScorePlayback(){
 if(!scorePlayback)return;
 for(const timer of scorePlayback.timers)clearTimeout(timer);
 for(const voice of scorePlayback.voices)try{voice.stop(audio().currentTime+.005)}catch{}
 scorePlayback=null;state.playingEventId=null;
 $$('.score-event.playing').forEach(el=>el.classList.remove('playing'));
 const button=$('#scorePlaybackToggle');if(button)button.textContent='▶ PLAY';
}
function playScore(){
 if(scorePlayback){stopScorePlayback();return;}
 const events=timeline(state.score);if(!events.length){toast('Add at least one note to play');return;}
 const ctx=audio(),seconds=60/state.score.tempo,start=ctx.currentTime+.16;
 scorePlayback={timers:[],voices:[]};
 $('#scorePlaybackToggle')?.replaceChildren(document.createTextNode('■ STOP'));
 for(const [i,ev] of events.entries()){
  // A tie is one continuous note across consecutive score events: do not retrigger.
  const tiedFromPrevious=i>0&&events[i-1].tieToNext;
  if(ev.type==='note'&&!tiedFromPrevious){let duration=ev.duration,following=i;
   while(events[following]?.tieToNext&&events[following+1]){following++;duration+=events[following].duration;}
   scorePlayback.voices.push(...synthEvent(ev,start+ev.onset*seconds,seconds,duration))}
  else if(ev.type==='chord')scorePlayback.voices.push(...synthEvent(ev,start+ev.onset*seconds,seconds));
  const ms=Math.max(0,(start+ev.onset*seconds-ctx.currentTime)*1000);
  scorePlayback.timers.push(setTimeout(()=>{
   if(!scorePlayback)return;
   state.playingEventId=ev.id;
   $$('.score-event').forEach(n=>n.classList.toggle('playing',n.dataset.eventId===ev.id));
  },ms));
 }
 const end=Math.max(...events.map(ev=>ev.onset+ev.duration));
 scorePlayback.timers.push(setTimeout(()=>{stopScorePlayback();toast('Score playback complete')},Math.max(0,(start+end*seconds-ctx.currentTime)*1000)+80));
}

 try{if(file.size>2_000_000)throw new Error('MusicXML exceeds 2 MB');

 }catch(error){toast(`MusicXML import failed: ${error.message}`)}

async function importBackup(file){
 try{
  if(file.size>5_000_000)throw new Error('Backup exceeds 5 MB');
  const data=JSON.parse(await file.text());
  // Validate every field, including all song scores, BEFORE requesting confirmation.
  const plan=prepareBackupRestore(data,{validateScore,validateProgression,validTechniqueProgress,validRhythmProgress,validReadingProgress});
  if(!confirm(`Restore ${data.songs.length} song(s) and ${data.progress.length} practice session(s)? This replaces the current local library. Export a backup of your current data first.`))return;
  // A write failure triggers restoration of the previous keys where possible.
  commitBackupRestore(localStorage,plan);
  if(data.progressionDraft)state.progression=structuredClone(data.progressionDraft);
  if(data.scoreDraft){
   stopScorePlayback();state.score=structuredClone(data.scoreDraft);
   scoreHistory=createHistory(state.score);state.scoreSongId=null;state.scoreEventId=null;
  }
  if(data.rhythm)state.rhythm=[...data.rhythm];
  if(data.tuning)state.tuning=data.tuning;
  if(data.display)state.display=data.display;
  state.songOpen=null;state.editing=false;
  render();toast('Backup restored. Keep your exported copy for safety.');
 }catch(error){toast(`Restore failed: ${error.message}`)}
}

function startMetronome(){stopMetronome();const ctx=audio();metroNext=ctx.currentTime+.06;metroBeat=0;metronomeTimer=setInterval(metronomeSchedule,25);metronomeSchedule()}
function stopMetronome(){if(metronomeTimer){clearInterval(metronomeTimer);metronomeTimer=null}$$('#metroBeats [data-beat]').forEach(el=>el.classList.remove('active'))}
function openTuner(){modal('Chromatic tuner',`<div class="eyebrow">TUNE BY EAR OR MICROPHONE</div><div class="big-tuner"><div class="tuner-note" id="tunerNote">—</div><div class="tuner-cents" id="tunerCents">Play one string at a time</div><div class="tuner-track"><div class="tuner-marker" id="tunerMarker"></div></div><div class="tuner-nums"><span>♭ 50¢</span><span>IN TUNE</span><span>50¢ ♯</span></div></div><div class="step-actions"><button class="btn gold" id="tunerMic">◉ Start microphone</button><button class="btn" id="tunerStop">■ Stop</button></div><p class="small-text" id="micStatus">Microphone audio is analysed only on your device; the app does not upload or save recordings. Use headphones to avoid feedback from reference tones.</p><hr class="divider"><div class="sub-label" style="margin-bottom:12px">REFERENCE STRINGS · ${h(TUNINGS[state.tuning].label)}</div><div class="tuner-strings">${TUNINGS[state.tuning].midi.map((m,i)=>`<button data-tone="${m}">${TUNINGS[state.tuning].names[i]}<small>${h(midiName(m))}</small></button>`).join('')}</div><div class="control" style="margin-top:16px"><label for="concertPitch">REFERENCE A4 (${state.a4} Hz)</label><input id="concertPitch" type="range" min="430" max="450" step="1" value="${state.a4}"></div>`);$('#tunerMic').onclick=startTuner;$('#tunerStop').onclick=stopTuner;$('#concertPitch').oninput=e=>{state.a4=Number(e.target.value);store('a4',state.a4);const label=e.target.previousElementSibling;label.textContent=`REFERENCE A4 (${state.a4} Hz)`};$$('[data-tone]').forEach(btn=>btn.onclick=()=>synth(Number(btn.dataset.tone),0,1,.14))}
async function startTuner(){stopTuner();const status=$('#micStatus');try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('This browser requires HTTPS or localhost for microphone access');tunerStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});tunerCtx=audio();tunerSource=tunerCtx.createMediaStreamSource(tunerStream);tunerAnalyser=tunerCtx.createAnalyser();tunerAnalyser.fftSize=4096;tunerSource.connect(tunerAnalyser);const data=new Float32Array(tunerAnalyser.fftSize);let last=0;const update=ts=>{if(!tunerAnalyser||!$('#tunerNote'))return;if(ts-last>90){last=ts;tunerAnalyser.getFloatTimeDomainData(data);const estimated=estimateFundamental(data,tunerCtx.sampleRate);const hz=estimated?.hz;if(hz){const fractional=freqMidi(hz,state.a4);const nearest=Math.round(fractional),cents=Math.round((fractional-nearest)*100);$('#tunerNote').textContent=midiName(nearest);$('#tunerCents').textContent=`${Math.round(hz)} Hz · ${Math.abs(cents)<=4?'In tune ✓':`${Math.abs(cents)} cents ${cents<0?'flat':'sharp'}`}`;$('#tunerMarker').style.left=`${Math.max(0,Math.min(100,50+cents))}%`;}else{$('#tunerNote').textContent='—';$('#tunerCents').textContent='Listening… play one clear note';}}tunerFrame=requestAnimationFrame(update)};status.textContent='Microphone active. All processing remains on this device.';tunerFrame=requestAnimationFrame(update);$('#tunerMic').textContent='◉ Listening…';}catch(e){status.textContent=`Microphone unavailable: ${e.message}. You can still tap the reference strings.`;stopTuner(false)}}
function stopTuner(updateUi=true){if(tunerFrame){cancelAnimationFrame(tunerFrame);tunerFrame=0}if(tunerStream){tunerStream.getTracks().forEach(t=>t.stop());tunerStream=null}if(tunerSource){tunerSource.disconnect();tunerSource=null}if(tunerAnalyser){tunerAnalyser.disconnect();tunerAnalyser=null}if(updateUi&&$('#tunerMic')){$('#tunerMic').textContent='◉ Start microphone';$('#micStatus').textContent='Microphone stopped. No audio was recorded or uploaded.'}}
function closeDialog(){stopTuner();stopMetronome();$('#toolDialog').close()}
function init(){newQuestion();state.selectedMidi=melody()[0]?.midi??60;render();$('#openTuner').onclick=openTuner;$('#openMetronome').onclick=openMetronome;document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('input',e=>{if(e.target.id==='repoSearch'){state.repoQuery=e.target.value;filterRepositoryRows()}});document.addEventListener('submit',handleSubmit);document.addEventListener('keydown',e=>{
 if(state.page==='score' && (e.ctrlKey||e.metaKey) && !e.altKey && !e.target.closest('input,textarea,select,[contenteditable="true"]')){
   if(e.key.toLowerCase()==='z'){e.preventDefault();restoreScoreHistory(e.shiftKey?'redo':'undo');return}
   if(e.key.toLowerCase()==='y'){e.preventDefault();restoreScoreHistory('redo');return}
 }
 if(e.code==='Space'&&state.page==='notation'&&rhythmLabPlayback&&!e.repeat&&!e.target.closest('input,textarea,select,[contenteditable="true"]')&&(!e.target.closest('button')||e.target.closest('[data-action="rhythm-lab-tap"]'))){e.preventDefault();tapRhythmLab();return}
 if((e.key==='Enter'||e.key===' ')&&e.target.closest('.score-event,[data-score-position],.score-note,.fret-cell')){e.preventDefault();e.target.closest('.score-event,[data-score-position],.score-note,.fret-cell').dispatchEvent(new MouseEvent('click',{bubbles:true}))}});$('#toolDialog').addEventListener('click',e=>{if(e.target.matches('[data-dialog-close]')||e.target===$('#toolDialog'))closeDialog()});$('#toolDialog').addEventListener('close',()=>{stopTuner();stopMetronome()});window.addEventListener('beforeunload',()=>{stopTuner();stopMetronome();stopRhythm();stopScorePlayback();stopTechniquePlayback();stopProgression();stopRhythmLab()});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});}
init();

</script>
